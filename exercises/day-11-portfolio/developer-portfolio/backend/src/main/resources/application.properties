# =========================================
# Application
# =========================================
spring.application.name=developer-portfolio-backend
server.port=8080

# =========================================
# PostgreSQL Datasource
# Update these values to match your local PostgreSQL setup
# =========================================
spring.datasource.url=jdbc:postgresql://ep-dark-glade-azsy2h9y-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_AeqLF4xtfi2E
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================
# JPA / Hibernate
# =========================================
# "update" auto-creates/updates tables based on entities - convenient for dev.
# Use "validate" or a migration tool (Flyway/Liquibase) in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# =========================================
# Jackson (JSON) - pretty print for readability during development
# =========================================
spring.jackson.serialization.indent-output=true

# =========================================
# Logging
# =========================================
logging.level.com.portfolio=INFO
logging.level.org.hibernate.SQL=DEBUG
