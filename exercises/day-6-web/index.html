<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Product Card</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

<div class="bg-white rounded-xl shadow-lg overflow-hidden w-80 md:w-96 hover:shadow-2xl transition">

    <img
        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800"
        class="w-full h-64 object-cover">

    <div class="p-6">

        <h2 class="text-2xl font-bold">
            Running Shoes
        </h2>

        <p class="text-gray-600 mt-2">
            Comfortable lightweight shoes perfect for daily running.
        </p>

        <div class="flex justify-between items-center mt-5">

            <span class="text-blue-600 text-xl font-bold">
                $89
            </span>

            <button
                class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg transition">
                Buy Now
            </button>

        </div>

    </div>

</div>

</body>
</html>
